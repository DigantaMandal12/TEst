name: CI & Production Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Automated Verification & Docker Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Phase Verification Suites
        run: npm run test:phases

      - name: Run Full Regression Test Suite
        run: npm test

      - name: Validate Production Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container (Syntax & Layer Check)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: campus-equipment-exchange:latest
